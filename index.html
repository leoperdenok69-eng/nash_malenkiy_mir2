<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Наш маленький мир ❤️</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f1e8;color:#403a35;font-family:Georgia,serif}header{text-align:center;padding:28px 15px 12px}h1{font-weight:500;font-size:clamp(28px,7vw,46px);margin:0}.sub{color:#88786d;margin:8px}.card{max-width:850px;margin:15px auto;padding:18px;background:#fffdf9;border:1px solid #ddd1c4;border-radius:22px;box-shadow:0 8px 30px #5b463d12}.tools,.colors{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid #d4c6b8;background:#fff;padding:10px 13px;border-radius:12px;font:inherit;cursor:pointer}button.active{background:#403a35;color:#fff}.color{width:38px;height:38px;padding:0;border-radius:50%}canvas{display:block;width:100%;max-width:760px;height:auto;margin:auto;background:#fff;border:1px solid #d9cec3;border-radius:14px;touch-action:none}.note{text-align:center;color:#88786d;font-size:14px}.foot{text-align:center;color:#9a8d83;font-size:13px;padding:20px}</style></head><body>
<header><h1>Наш маленький мир ❤️</h1><p class="sub">Раскрась мой рисунок</p></header><main class="card"><div class="tools"><button id="fill" class="active">🪣 Заливка</button><button id="brush">🖌️ Кисть</button><button id="erase">🧽 Ластик</button><button id="undo">↩️ Отменить</button><button id="reset">🔄 Сначала</button><button id="save">💾 Сохранить</button></div><div class="colors" id="colors"></div><canvas id="c" width="760" height="760"></canvas><p class="note">На телефоне — пальцем, на компьютере — мышкой.</p></main><div class="foot">Сделано специально для вас двоих ✨</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),cols=['#e9b7b0','#e7c58f','#eadf9b','#b9d7b0','#9fc8d8','#b9b0d9','#d6a6c8','#f4d6b0','#ffffff','#403a35'];let mode='fill',col=cols[0],hist=[];
function base(){x.fillStyle='#fff';x.fillRect(0,0,760,760);x.strokeStyle='#403a35';x.lineWidth=7;x.lineCap='round';x.lineJoin='round';x.beginPath();x.arc(380,380,245,0,7);x.stroke();[[300,345],[460,345]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],28,0,7);x.stroke();x.beginPath();x.arc(p[0],p[1],7,0,7);x.fillStyle='#403a35';x.fill()});x.beginPath();x.arc(380,415,105,0,Math.PI);x.stroke();x.beginPath();x.moveTo(260,205);x.quadraticCurveTo(380,125,500,205);x.stroke();x.beginPath();x.moveTo(270,540);x.quadraticCurveTo(380,610,490,540);x.stroke();x.font='34px Georgia';x.fillStyle='#403a35';x.textAlign='center';x.fillText('для тебя',380,690)}
function snap(){hist.push(x.getImageData(0,0,760,760));if(hist.length>20)hist.shift()}base();snap();
cols.forEach(z=>{let b=document.createElement('button');b.className='color';b.style.background=z;b.onclick=()=>{col=z;mode='fill';active('fill')};document.getElementById('colors').appendChild(b)});
function active(id){['fill','brush','erase'].forEach(a=>document.getElementById(a).classList.remove('active'));document.getElementById(id).classList.add('active')};
fill.onclick=()=>{mode='fill';active('fill')};brush.onclick=()=>{mode='brush';active('brush')};erase.onclick=()=>{mode='erase';active('erase')};
function pos(e){let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*760/r.width,y:(p.clientY-r.top)*760/r.width}}
let down=false;c.addEventListener('pointerdown',e=>{e.preventDefault();let p=pos(e);snap();if(mode==='fill')fillAt(p.x|0,p.y|0);else{down=true;stroke(p)}});c.addEventListener('pointermove',e=>{if(down)stroke(pos(e))});window.addEventListener('pointerup',()=>down=false);
function stroke(p){x.lineWidth=mode==='erase'?28:10;x.strokeStyle=mode==='erase'?'#fff':col;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x+.1,p.y+.1);x.stroke()}
function rgb(h){h=h.slice(1);return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function fillAt(sx,sy){let im=x.getImageData(0,0,760,760),d=im.data,n=(sy*760+sx)*4,t=[d[n],d[n+1],d[n+2]],q=[[sx,sy]],seen=new Uint8Array(760*760),nc=rgb(col);if(t.every((v,i)=>Math.abs(v-nc[i])<10))return;while(q.length){let [px,py]=q.pop();if(px<0||py<0||px>=760||py>=760)continue;let k=py*760+px;if(seen[k])continue;seen[k]=1;let i=k*4;if(Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])>35)continue;d[i]=nc[0];d[i+1]=nc[1];d[i+2]=nc[2];d[i+3]=255;q.push([px+1,py],[px-1,py],[px,py+1],[px,py-1])}x.putImageData(im,0,0)}
undo.onclick=()=>{if(hist.length>1){hist.pop();x.putImageData(hist[hist.length-1],0,0)}};reset.onclick=()=>{if(confirm('Начать заново?')){hist=[];base();snap()}};save.onclick=()=>{let a=document.createElement('a');a.download='nash-malenkiy-mir.png';a.href=c.toDataURL();a.click()};
</script></body></html>
